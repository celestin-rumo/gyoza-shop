services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev

    ports:
      - "4200:4200"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    working_dir: /app

    environment:
      NG_ALLOWED_HOSTS: "localhost,127.0.0.1"

    command: >
      sh -c "npm ci &&
             npm start -- --host 0.0.0.0"

  database:
    image: postgres:17
    container_name: gyoza-database

    environment:
      POSTGRES_DB: gyoza
      POSTGRES_USER: gyoza
      POSTGRES_PASSWORD: gyoza

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  frontend_node_modules:
  postgres_data:
