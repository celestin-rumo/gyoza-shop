services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev

    ports:
      - "4200:4200"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    working_dir: /app

    environment:
      NG_ALLOWED_HOSTS: "localhost,127.0.0.1"

    command: >
      sh -c "npm ci &&
            npm start -- --host 0.0.0.0 --proxy-config proxy.conf.json"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev

    container_name: gyoza-backend

    ports:
      - "8080:8080"

    environment:
      DB_URL: jdbc:postgresql://database:5432/gyoza
      DB_USERNAME: gyoza
      DB_PASSWORD: gyoza
      ADMIN_EMAIL: admin@gyoza.local
      ADMIN_PASSWORD: changeme

    depends_on:
      database:
        condition: service_healthy

    develop:
      watch:
        - action: sync+restart
          path: ./backend/src
          target: /app/src

        - action: rebuild
          path: ./backend/pom.xml

  database:
    image: postgres:17

    container_name: gyoza-database

    environment:
      POSTGRES_DB: gyoza
      POSTGRES_USER: gyoza
      POSTGRES_PASSWORD: gyoza

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gyoza -d gyoza"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  frontend_node_modules:
