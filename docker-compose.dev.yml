services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev

    ports:
      - "4200:4200"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    working_dir: /app

    environment:
      NG_ALLOWED_HOSTS: "localhost,127.0.0.1"

    command: >
      sh -c "npm ci &&
             npm start -- --host 0.0.0.0"

volumes:
  frontend_node_modules:
