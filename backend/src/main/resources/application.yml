spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gyoza}
    username: ${DB_USERNAME:gyoza}
    password: ${DB_PASSWORD:gyoza}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:changeme}
    token-ttl-hours: ${ADMIN_TOKEN_TTL_HOURS:8}