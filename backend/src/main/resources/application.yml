spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gyoza}
    username: ${DB_USERNAME:gyoza}
    password: ${DB_PASSWORD:gyoza}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 8h
      cookie:
        same-site: lax

app:
  admin:
    email: ${ADMIN_EMAIL:admin@example.com}
    password: ${ADMIN_PASSWORD:changeme}
  mail:
    provider: ${MAIL_PROVIDER:log}
    from-address: ${MAIL_FROM:no-reply@celestinrumo.ch}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:4200}