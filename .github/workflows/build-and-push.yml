name: Build and Push Images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Manual release version (ex: v1.0.0)"
        required: true
        default: "v1.0.0"
        type: string

concurrency:
  group: build-and-push-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_FRONTEND: ghcr.io/celestin-rumo/gyoza-frontend
  IMAGE_BACKEND: ghcr.io/celestin-rumo/gyoza-backend

jobs:
  prepare-meta:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - name: Compute release metadata
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "release_tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "release_name=Release ${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=main-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "release_name=Main build #${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          fi

  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run unit + integration tests
        working-directory: frontend
        run: npm run test:ci

      - name: Coverage summary
        if: always()
        run: |
          if [ ! -f frontend/coverage/frontend/coverage-summary.json ]; then
            echo "No frontend coverage report found." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          python3 <<'PYEOF' >> "$GITHUB_STEP_SUMMARY"
          import json

          total = json.load(open("frontend/coverage/frontend/coverage-summary.json"))["total"]

          print("### Frontend coverage\n")
          print("| Metric | Covered | Total | % |")
          print("|---|---|---|---|")
          for key in ["lines", "statements", "functions", "branches"]:
              m = total[key]
              print(f"| {key.capitalize()} | {m['covered']} | {m['total']} | {m['pct']}% |")
          PYEOF

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/frontend/
          retention-days: 14

  test-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # `verify` runs unit tests (Surefire) then integration tests (Failsafe +
      # Testcontainers) in one command; Docker is already available on this runner.
      - name: Run unit + integration tests
        working-directory: backend
        run: mvn -B verify

      - name: Coverage summary
        if: always()
        run: |
          if [ ! -f backend/target/site/jacoco/jacoco.xml ]; then
            echo "No backend coverage report found." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          python3 <<'PYEOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET

          root = ET.parse("backend/target/site/jacoco/jacoco.xml").getroot()
          names = {
              "INSTRUCTION": "Instructions",
              "BRANCH": "Branches",
              "LINE": "Lines",
              "METHOD": "Methods",
              "CLASS": "Classes",
          }

          print("### Backend coverage\n")
          print("| Metric | Covered | Total | % |")
          print("|---|---|---|---|")
          for counter in root.findall("counter"):
              counter_type = counter.get("type")
              if counter_type not in names:
                  continue
              missed = int(counter.get("missed"))
              covered = int(counter.get("covered"))
              total = missed + covered
              pct = round(100 * covered / total, 1) if total else 0
              print(f"| {names[counter_type]} | {covered} | {total} | {pct}% |")
          PYEOF

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/
          retention-days: 14

  build-frontend:
    needs: [prepare-meta, test-frontend]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_FRONTEND }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}
            type=raw,value=${{ needs.prepare-meta.outputs.release_tag }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  build-backend:
    needs: [prepare-meta, test-backend]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BACKEND }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}
            type=raw,value=${{ needs.prepare-meta.outputs.release_tag }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  e2e:
    needs: [build-frontend, build-backend]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start the e2e stack
        run: docker compose -f docker-compose.e2e.yml up -d --build --wait

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run e2e tests
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Tear down the e2e stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v

  create-tag:
    needs:
      - prepare-meta
      - build-frontend
      - build-backend
      - e2e
    if: >
      always() &&
      needs.prepare-meta.result == 'success' &&
      needs.build-frontend.result == 'success' &&
      needs.build-backend.result == 'success' &&
      needs.e2e.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create git tag if missing
        shell: bash
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/${{ needs.prepare-meta.outputs.release_tag }}$"; then
            echo "Tag already exists on origin"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "${{ needs.prepare-meta.outputs.release_tag }}"
            git push origin "${{ needs.prepare-meta.outputs.release_tag }}"
          fi

  release:
    needs:
      - prepare-meta
      - build-frontend
      - build-backend
      - e2e
      - create-tag
    if: >
      always() &&
      needs.build-frontend.result == 'success' &&
      needs.build-backend.result == 'success' &&
      needs.e2e.result == 'success' &&
      needs.create-tag.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-meta.outputs.release_tag }}
          name: ${{ needs.prepare-meta.outputs.release_name }}
          generate_release_notes: true
          prerelease: ${{ needs.prepare-meta.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.prepare-meta.outputs.is_prerelease != 'true' }}
          body: |
            Docker images published for `${{ needs.prepare-meta.outputs.release_tag }}`

            Frontend:
            - `${{ env.IMAGE_FRONTEND }}:${{ needs.prepare-meta.outputs.release_tag }}`
            - `${{ env.IMAGE_FRONTEND }}:${{ github.sha }}`
            - `${{ env.IMAGE_FRONTEND }}:latest`

            Backend:
            - `${{ env.IMAGE_BACKEND }}:${{ needs.prepare-meta.outputs.release_tag }}`
            - `${{ env.IMAGE_BACKEND }}:${{ github.sha }}`
            - `${{ env.IMAGE_BACKEND }}:latest`
