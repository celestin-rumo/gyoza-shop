<ds-auth-card title="Réinitialiser le mot de passe">
  <form [formRoot]="resetPasswordForm" class="reset-password-form">
    <ds-form-field
      label="Nouveau mot de passe"
      fieldId="newPassword"
      type="password"
      autocomplete="new-password"
      [field]="resetPasswordForm.newPassword"
    ></ds-form-field>

    <ds-form-field
      label="Confirmer le mot de passe"
      fieldId="confirmPassword"
      type="password"
      autocomplete="new-password"
      [field]="resetPasswordForm.confirmPassword"
    ></ds-form-field>

    @if (submitError()) {
      <ds-form-message variant="error">{{ submitError() }}</ds-form-message>
    }

    <ds-button type="submit" variant="primary" size="md" [fullWidth]="true" [disabled]="submitting()">
      {{ submitting() ? 'Enregistrement…' : 'Réinitialiser le mot de passe' }}
    </ds-button>
  </form>
</ds-auth-card>
