<ds-auth-card title="Mot de passe oublié" subtitle="Reçois un lien pour choisir un nouveau mot de passe.">
  @if (submitted()) {
    <ds-form-message variant="success">
      Si un compte existe avec cette adresse, un email vient de t’être envoyé.
    </ds-form-message>
  } @else {
    <form [formRoot]="forgotPasswordForm" class="forgot-password-form">
      <ds-form-field
        label="Email"
        fieldId="email"
        type="email"
        autocomplete="email"
        [field]="forgotPasswordForm.email"
      ></ds-form-field>

      <ds-button type="submit" variant="primary" size="md" [fullWidth]="true" [disabled]="submitting()">
        {{ submitting() ? 'Envoi en cours…' : 'Envoyer le lien' }}
      </ds-button>
    </form>
  }
</ds-auth-card>
