<div class="ds-section-header" [class.ds-section-header--left]="align === 'left'">
  @if (level === 1) {
    <h1 class="ds-section-header__title">{{ title }}</h1>
  } @else {
    <h2 class="ds-section-header__title">{{ title }}</h2>
  }
  @if (subtitle) {
    <p class="ds-section-header__subtitle">{{ subtitle }}</p>
  }
</div>
