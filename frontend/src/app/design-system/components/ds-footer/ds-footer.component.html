<footer class="ds-footer">
  <div class="ds-footer__top">
    <div class="ds-footer__brand">
      <span class="ds-footer__logo">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="20" r="19" stroke="currentColor" stroke-width="1.5" />
          <path
            d="M11 22c3 4 15 4 18 0"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          />
        </svg>
      </span>
      <span class="ds-footer__brand-text">
        <strong>{{ brand }}</strong>
        <small>{{ brandSuffix }}</small>
      </span>
    </div>

    <ul class="ds-footer__info">
      <li>
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M12 21s7-6.1 7-11.5A7 7 0 0 0 5 9.5C5 14.9 12 21 12 21Z"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linejoin="round"
          />
          <circle cx="12" cy="9.5" r="2.4" stroke="currentColor" stroke-width="1.6" />
        </svg>
        <span>{{ address }}</span>
      </li>
      <li>
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3.5" y="5.5" width="17" height="13" rx="2" stroke="currentColor" stroke-width="1.6" />
          <path d="m4.5 7 7.5 6 7.5-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <a [href]="mailHref">{{ email }}</a>
      </li>
      <li>
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M6.5 4h3l1.5 4.5-2 1.5a11 11 0 0 0 5 5l1.5-2 4.5 1.5v3a2 2 0 0 1-2.2 2C10.8 19 5 13.2 4.5 6.2A2 2 0 0 1 6.5 4Z"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linejoin="round"
          />
        </svg>
        <a [href]="telHref">{{ phone }}</a>
      </li>
    </ul>
  </div>

  <div class="ds-footer__bottom">
    <span>&copy; {{ currentYear }} {{ brand }} {{ brandSuffix }}. Tous droits réservés.</span>
  </div>
</footer>
